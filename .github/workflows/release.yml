name: Release
on:
  push:
    branches:
      - main
    paths:
      - '**.ts'
      - '**.json'
  workflow_dispatch:

concurrency: release

jobs:
  update:
    if: github.repository_owner == 'PreMiD'
    name: Update activities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Install pmd
        run: npm ci

      - name: Update activities
        if: github.event_name == 'push'
        run: npx pmd release
        env:
          CONNECT_TO_DEV: ${{ vars.CONNECT_TO_DEV}}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release changed sync scripts
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: npx pmd sync-release --changed
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_SCRIPT_SIGNING_KEY: ${{ secrets.SYNC_SCRIPT_SIGNING_KEY }}

      - name: Release all sync scripts
        if: github.event_name == 'workflow_dispatch'
        run: npx pmd sync-release --all
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_SCRIPT_SIGNING_KEY: ${{ secrets.SYNC_SCRIPT_SIGNING_KEY }}
